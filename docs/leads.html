<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>음식물처리기 영업 리드</title>
<style>
:root{--bg:#101319;--surface:#191f28;--surface2:#202734;--line:#2b3441;--text:#edf0f4;--dim:#929cab;--amber:#ff9f1c;--amber2:#5b3b13;--teal:#49c9bd;--teal2:#153f3b;--violet:#a78bfa;--violet2:#332a50;--green:#6ee7a8;--red:#fb7185;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}.wrap{max-width:1400px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.back{color:var(--dim);text-decoration:none;font-size:13px}.eyebrow{font:12px var(--mono);letter-spacing:.12em;color:var(--amber);margin:12px 0 7px}h1{font-size:28px;margin:0 0 7px}.subtitle,.meta{color:var(--dim);font-size:13px}.meta{font:12px var(--mono);margin-top:8px}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}.stat-label{font-size:11px;color:var(--dim)}.stat-value{font:700 20px var(--mono);margin-top:6px}.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}.filter-row:last-child{margin-bottom:0}input,select,button{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:9px 11px;font-family:var(--sans);font-size:12.5px}input.search{flex:1;min-width:260px}input.amount{width:120px}button{cursor:pointer}.search-btn{background:var(--amber);border-color:var(--amber);color:#151515;font-weight:700;min-width:72px}.search-btn:hover{filter:brightness(1.06)}.toggle.active{border-color:var(--violet);color:var(--violet);background:var(--violet2)}.count{font:12px var(--mono);color:var(--dim);margin:11px 2px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}table{width:100%;border-collapse:collapse;min-width:1120px}th{position:sticky;top:0;background:#161b23;color:var(--dim);font-size:11.5px;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);z-index:2}td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top}tr{cursor:pointer}tbody tr:hover{background:var(--surface2)}.grade{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font:700 12px var(--mono)}.grade.A{background:var(--violet2);color:var(--violet)}.grade.B{background:var(--amber2);color:var(--amber)}.grade.C{background:var(--teal2);color:var(--teal)}.grade.-{background:var(--line);color:var(--dim)}.title{font-weight:650;max-width:410px}.sub{font-size:11px;color:var(--dim);margin-top:4px}.badge{display:inline-block;padding:3px 7px;border-radius:5px;font:10.5px var(--mono);white-space:nowrap}.badge.open{background:var(--violet2);color:var(--violet)}.badge.closed{background:var(--line);color:var(--dim)}.badge.equip{background:var(--amber2);color:var(--amber)}.badge.other{background:var(--teal2);color:var(--teal)}.num{text-align:right;font-family:var(--mono);white-space:nowrap}.drawer{position:fixed;inset:0;display:none;z-index:10}.drawer.open{display:block}.backdrop{position:absolute;inset:0;background:#0009}.drawer-panel{position:absolute;right:0;top:0;height:100%;width:min(620px,94vw);background:var(--surface);border-left:1px solid var(--line);padding:24px;overflow:auto}.drawer-head{display:flex;justify-content:space-between;gap:15px}.close{font-size:20px;background:transparent;border:0}.drawer-title{font-size:20px;font-weight:700;margin:10px 0}.hero-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 20px}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}.summary-box{background:var(--surface2);padding:12px;border-radius:8px}.summary-box .k{font-size:11px;color:var(--dim)}.summary-box .v{font-size:13px;margin-top:5px}.detail{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line)}.detail div{padding:9px 5px;border-bottom:1px solid var(--line);font-size:12px}.detail .k{color:var(--dim)}.empty{text-align:center;padding:50px;color:var(--dim)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{display:block}.summary-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="top"><div><a class="back" href="index.html">← 영업 대시보드</a><div class="eyebrow">PROCUREMENT LEAD WORKBENCH</div><h1>음식물처리기 영업 리드</h1><div class="subtitle">진행상태, 세부분류, 금액과 우선등급으로 실제 대응 대상을 좁혀보세요.</div><div class="meta" id="updated"><span class="status-dot"></span>데이터 불러오는 중...</div></div></div>
<div class="stats" id="stats"></div>
<div class="filters"><div class="filter-row"><input class="search" id="search" placeholder="사업명, 기관명, 업체명 등 전체 검색"><button class="search-btn" id="searchBtn" type="button">검색</button><select id="source"><option value="">전체 출처</option><option>발주계획</option><option>입찰공고</option><option>계약정보</option></select><select id="category"><option value="">전체 분류</option><option>핵심장비</option><option>장비구매</option><option>장비임차</option><option>유지보수</option><option>폐기물처리용역</option><option>부속·비품</option><option>기타구매</option><option>기타</option></select><select id="status"><option value="">전체 상태</option></select><select id="grade"><option value="">전체 등급</option><option value="A">A 즉시대응</option><option value="B">B 검토</option><option value="C">C 모니터링</option></select></div><div class="filter-row"><select id="year"><option value="">전체 연도</option></select><input class="amount" type="number" id="min" placeholder="최소 만원"><input class="amount" type="number" id="max" placeholder="최대 만원"><select id="sort"><option value="score">우선순위순</option><option value="date">최신순</option><option value="amount">금액순</option></select><button class="toggle" id="openOnly">진행 중만</button><button id="reset">초기화</button></div></div>
<div class="count" id="count"></div><div class="table-wrap"><table><thead><tr><th>등급</th><th>사업명 / 기관</th><th>출처</th><th>분류</th><th>금액</th><th>상태</th><th>일자</th><th>업체 / 낙찰률</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="drawer" id="drawer"><div class="backdrop"></div><aside class="drawer-panel"><div class="drawer-head"><div class="eyebrow">LEAD DETAIL</div><button class="close">×</button></div><div id="drawerContent"></div></aside></div>
<script>
let DATA,all=[],state={q:'',source:'',category:'',status:'',grade:'',year:'',min:null,max:null,sort:'score',open:false};
const $=id=>document.getElementById(id),won=n=>!n?'-':n>=1e8?(n/1e8).toFixed(1)+'억원':n>=1e4?Math.round(n/1e4).toLocaleString()+'만원':n.toLocaleString()+'원',esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
fetch('data/leads.json?_='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;Object.values(d.sources||{}).forEach(s=>{s.equipment.forEach(r=>all.push(r));s.other.forEach(r=>all.push(r))});init()}).catch(()=>$('updated').textContent='데이터를 불러오지 못했습니다.');
function init(){$('updated').innerHTML='<span class="status-dot"></span>마지막 갱신 '+esc(DATA.updated_at);const statuses=[...new Set(all.map(r=>r._status).filter(Boolean))].sort(),years=[...new Set(all.map(r=>String(r._date_sort_key||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();$('status').innerHTML='<option value="">전체 상태</option>'+statuses.map(v=>`<option>${esc(v)}</option>`).join('');$('year').innerHTML='<option value="">전체 연도</option>'+years.map(v=>`<option>${v}</option>`).join('');const p=new URLSearchParams(location.search);if(p.get('open')){state.open=true;$('openOnly').classList.add('active')}bind();render()}
function bind(){['source','category','status','grade','year','min','max','sort'].forEach(id=>$(id).addEventListener(id==='min'||id==='max'?'input':'change',e=>{let k=id,v=e.target.value;if(id==='min'||id==='max')v=v?Number(v)*10000:null;state[k]=v;render()}));const runSearch=()=>{state.q=$('search').value.trim();render()};$('searchBtn').onclick=runSearch;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});$('openOnly').onclick=()=>{state.open=!state.open;$('openOnly').classList.toggle('active',state.open);render()};$('reset').onclick=()=>{state={q:'',source:'',category:'',status:'',grade:'',year:'',min:null,max:null,sort:'score',open:false};document.querySelectorAll('input,select').forEach(el=>{if(el.id==='sort')el.value='score';else el.value=''});$('openOnly').classList.remove('active');render()};document.querySelector('.backdrop').onclick=closeDrawer;document.querySelector('.close').onclick=closeDrawer}
function filtered(){let rows=all.filter(r=>{if(state.q&&!Object.values(r).some(v=>String(v||'').toLowerCase().includes(state.q.toLowerCase())))return false;if(state.source&&r._source!==state.source)return false;if(state.category&&r._detail_category!==state.category)return false;if(state.status&&r._status!==state.status)return false;if(state.grade&&r._grade!==state.grade)return false;if(state.year&&!String(r._date_sort_key||'').startsWith(state.year))return false;if(state.open&&!r._is_open)return false;if(state.min!=null&&(r._amount||0)<state.min)return false;if(state.max!=null&&(r._amount||0)>state.max)return false;return true});rows.sort((a,b)=>state.sort==='amount'?(b._amount||0)-(a._amount||0):state.sort==='date'?String(b._date_sort_key||'').localeCompare(String(a._date_sort_key||'')):(b._score||0)-(a._score||0)||(b._amount||0)-(a._amount||0));return rows}
function render(){const rows=filtered(),open=rows.filter(r=>r._is_open),amount=rows.reduce((s,r)=>s+(r._amount||0),0),a=rows.filter(r=>r._grade==='A').length;$('stats').innerHTML=[['검색 결과',rows.length.toLocaleString()+'건'],['진행 중',open.length.toLocaleString()+'건'],['합계 금액',won(amount)],['A등급 즉시대응',a.toLocaleString()+'건']].map(x=>`<div class="stat"><div class="stat-label">${x[0]}</div><div class="stat-value">${x[1]}</div></div>`).join('');$('count').textContent=`${rows.length.toLocaleString()}건 중 최대 1,000건 표시`;$('rows').innerHTML=rows.slice(0,1000).map((r,i)=>`<tr data-i="${i}"><td><span class="grade ${r._grade}">${r._grade}</span><div class="sub">${r._score||0}점</div></td><td><div class="title">${esc(r._title)}</div><div class="sub">${esc(r._agency||'-')} · ${esc(r._tab||'')}</div></td><td>${esc(r._source)}</td><td><span class="badge ${['핵심장비','장비구매','장비임차'].includes(r._detail_category)?'equip':'other'}">${esc(r._detail_category)}</span></td><td class="num">${won(r._amount)}</td><td><span class="badge ${r._is_open?'open':'closed'}">${esc(r._status)}</span></td><td>${formatDate(r._date_sort_key)}</td><td>${esc(r._company||'-')}<div class="sub">${r._bid_rate!=null?'낙찰률 '+r._bid_rate+'%':''}</div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">조건에 맞는 데이터가 없습니다.</td></tr>';document.querySelectorAll('tbody tr[data-i]').forEach(tr=>tr.onclick=()=>openDrawer(rows[Number(tr.dataset.i)]))}
function formatDate(v){v=String(v||'');return v.length>=8?`${v.slice(0,4)}.${v.slice(4,6)}.${v.slice(6,8)}`:v.length>=6?`${v.slice(0,4)}.${v.slice(4,6)}`:v||'-'}
function openDrawer(r){const visible=Object.entries(r).filter(([k,v])=>!k.startsWith('_')&&v);$('drawerContent').innerHTML=`<div class="drawer-title">${esc(r._title)}</div><div class="hero-meta"><span class="grade ${r._grade}">${r._grade}</span><span class="badge ${r._is_open?'open':'closed'}">${esc(r._status)}</span><span class="badge ${['핵심장비','장비구매','장비임차'].includes(r._detail_category)?'equip':'other'}">${esc(r._detail_category)}</span></div><div class="summary-grid"><div class="summary-box"><div class="k">발주기관</div><div class="v">${esc(r._agency||'-')}</div></div><div class="summary-box"><div class="k">사업금액</div><div class="v">${won(r._amount)}</div></div><div class="summary-box"><div class="k">출처 / 기준일</div><div class="v">${esc(r._source)} · ${formatDate(r._date_sort_key)}</div></div><div class="summary-box"><div class="k">우선순위</div><div class="v">${r._grade}등급 · ${r._score||0}점</div></div></div><div class="detail">${visible.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${esc(v)}</div>`).join('')}</div>`;$('drawer').classList.add('open')}
function closeDrawer(){$('drawer').classList.remove('open')}
</script></body></html>
