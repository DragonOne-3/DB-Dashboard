<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>음식물처리기 영업 리드</title>
<style>

:root{--bg:#ffffff;--surface:#ffffff;--surface2:#f8fafc;--line:#e2e8f0;--text:#111827;--dim:#64748b;--navy:#0f2f57;--blue:#1d4ed8;--blue2:#eff6ff;--amber:#e98200;--amber2:#fff7ed;--teal:#0f766e;--teal2:#ecfdf5;--violet:#6d28d9;--violet2:#f5f3ff;--green:#16a34a;--red:#dc2626;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:var(--sans);line-height:1.5}.wrap{max-width:1400px;margin:auto;padding:30px 22px 72px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:20px;border-bottom:1px solid var(--line)}.back{color:var(--blue);text-decoration:none;font-size:13px;font-weight:700}.back:hover{text-decoration:underline}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue);margin:12px 0 7px}h1{font-size:30px;margin:0 0 7px;color:var(--navy);font-weight:800;letter-spacing:-.03em}.subtitle{color:#334155;font-size:13px}.meta{color:var(--dim);font:12px var(--mono);margin-top:8px}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.stat{background:#fff;border:1px solid var(--line);border-top:3px solid #dbeafe;border-radius:10px;padding:14px 15px}.stat-label{font-size:11px;color:#475569;font-weight:700}.stat-value{font:800 20px var(--mono);margin-top:6px;color:var(--navy)}.filters{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:14px}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}.filter-row:last-child{margin-bottom:0}input,select,button{background:#fff;border:1px solid #cbd5e1;color:var(--text);border-radius:7px;padding:9px 11px;font-family:var(--sans);font-size:12.5px}input:focus,select:focus{outline:2px solid #bfdbfe;border-color:#60a5fa}input.search{flex:1;min-width:260px}input.amount{width:120px}button{cursor:pointer;font-weight:700}.search-btn{background:var(--navy);border-color:var(--navy);color:#fff;min-width:72px}.search-btn:hover{background:#173f70}.toggle.active{border-color:var(--blue);color:var(--blue);background:var(--blue2)}.count{font:12px var(--mono);color:var(--dim);margin:11px 2px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table{width:100%;border-collapse:collapse;min-width:1120px}th{position:sticky;top:0;background:#f8fafc;color:#334155;font-size:11.5px;font-weight:800;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);z-index:2}td{padding:11px 10px;border-bottom:1px solid #edf2f7;font-size:12.5px;vertical-align:top}tr{cursor:pointer}tbody tr:hover{background:#f8fafc}.grade{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font:800 12px var(--mono)}.grade.A{background:var(--blue2);color:var(--blue)}.grade.B{background:var(--amber2);color:var(--amber)}.grade.C{background:var(--teal2);color:var(--teal)}.grade.-{background:#f1f5f9;color:var(--dim)}.title{font-weight:800;color:#111827;max-width:410px}.sub{font-size:11px;color:var(--dim);margin-top:4px}.badge{display:inline-block;padding:3px 7px;border-radius:5px;font:700 10.5px var(--mono);white-space:nowrap}.badge.open{background:var(--blue2);color:var(--blue)}.badge.closed{background:#f1f5f9;color:var(--dim)}.badge.equip{background:var(--amber2);color:var(--amber)}.badge.other{background:var(--teal2);color:var(--teal)}.badge.repeat{background:#f1f5f9;color:#475569;margin-left:5px}.num{text-align:right;font-family:var(--mono);font-weight:700;color:var(--navy);white-space:nowrap}.drawer{position:fixed;inset:0;display:none;z-index:10}.drawer.open{display:block}.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.28)}.drawer-panel{position:absolute;right:0;top:0;height:100%;width:min(620px,94vw);background:#fff;border-left:1px solid var(--line);padding:24px;overflow:auto;box-shadow:-12px 0 32px rgba(15,23,42,.12)}.drawer-head{display:flex;justify-content:space-between;gap:15px}.close{font-size:20px;background:transparent;border:0;color:var(--navy)}.drawer-title{font-size:20px;font-weight:800;color:var(--navy);margin:10px 0}.hero-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 20px}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}.summary-box{background:#f8fafc;border:1px solid #edf2f7;padding:12px;border-radius:8px}.summary-box .k{font-size:11px;color:var(--dim);font-weight:700}.summary-box .v{font-size:13px;margin-top:5px;font-weight:800;color:var(--navy)}.detail{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line)}.detail div{padding:9px 5px;border-bottom:1px solid var(--line);font-size:12px}.detail .k{color:#475569;font-weight:700}.lookup-btn{border:1px solid #cbd5e1;background:#fff;color:var(--blue);font-weight:800;border-radius:7px;padding:7px 10px;cursor:pointer;white-space:nowrap}.lookup-btn:hover{background:var(--blue2);border-color:#93c5fd}.drawer-actions{display:flex;gap:8px;margin:14px 0 20px}.empty{text-align:center;padding:50px;color:var(--dim)}strong,b{font-weight:800;color:var(--navy)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{display:block}.summary-grid{grid-template-columns:1fr}}

</style></head>
<body><div class="wrap"><div class="top"><div><a class="back" href="index.html">← 영업 대시보드</a><div class="eyebrow">조달 영업 리드</div><h1>음식물처리기 영업 리드</h1><div class="subtitle">진행 상태, 사업금액, 발주기관을 기준으로 <strong>우선 대응 대상</strong>을 확인합니다.</div><div class="meta" id="updated"><span class="status-dot"></span>데이터 불러오는 중...</div></div></div>
<div class="stats" id="stats"></div>
<div class="filters"><div class="filter-row"><input class="search" id="search" placeholder="사업명, 기관명, 업체명 등 전체 검색"><button class="search-btn" id="searchBtn" type="button">검색</button><select id="source"><option value="">전체 출처</option><option>발주계획</option><option>입찰공고</option><option>계약정보</option></select><select id="category"><option value="">전체 분류</option><option>핵심장비</option><option>장비구매</option><option>장비임차</option><option>유지보수</option><option>폐기물처리용역</option><option>부속·비품</option><option>기타구매</option><option>기타</option></select><select id="status"><option value="">전체 상태</option></select><select id="grade"><option value="">전체 등급</option><option value="A">A 즉시대응</option><option value="B">B 검토</option><option value="C">C 모니터링</option></select></div><div class="filter-row"><select id="year"></select><input class="amount" type="number" id="min" placeholder="최소 만원"><input class="amount" type="number" id="max" placeholder="최대 만원"><select id="sort"><option value="score">우선순위순</option><option value="date">최신순</option><option value="amount">금액순</option></select><button class="toggle" id="openOnly">진행 중만</button><button id="reset">초기화</button></div></div>
<div class="count" id="count"></div><div class="table-wrap"><table><thead><tr><th>등급</th><th>사업명 / 기관</th><th>출처</th><th>분류</th><th>금액</th><th>상태</th><th>일자</th><th>업체 / 낙찰률</th><th>D2B</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="drawer" id="drawer"><div class="backdrop"></div><aside class="drawer-panel"><div class="drawer-head"><div class="eyebrow">LEAD DETAIL</div><button class="close">×</button></div><div id="drawerContent"></div></aside></div>
<script>
let DATA,all=[],state={q:'',source:'',category:'',status:'',grade:'',year:'recent',min:null,max:null,sort:'score',open:false};
const $=id=>document.getElementById(id),won=n=>!n?'-':n>=1e8?(n/1e8).toFixed(1)+'억원':n>=1e4?Math.round(n/1e4).toLocaleString()+'만원':n.toLocaleString()+'원',esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
fetch('data/leads.json?_='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;Object.values(d.sources||{}).forEach(s=>{s.equipment.forEach(r=>all.push(r));s.other.forEach(r=>all.push(r))});init()}).catch(()=>$('updated').textContent='데이터를 불러오지 못했습니다.');
function recentCutoffYm(){const d=new Date();d.setFullYear(d.getFullYear()-1);return d.getFullYear()*100+(d.getMonth()+1)}
function init(){$('updated').innerHTML='<span class="status-dot"></span>마지막 갱신 '+esc(DATA.updated_at);const statuses=[...new Set(all.map(r=>r._status).filter(Boolean))].sort(),years=[...new Set(all.map(r=>String(r._date_sort_key||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();$('status').innerHTML='<option value="">전체 상태</option>'+statuses.map(v=>`<option>${esc(v)}</option>`).join('');$('year').innerHTML='<option value="recent">최근 1년</option><option value="">전체 기간</option>'+years.map(v=>`<option value="${v}">${v}년</option>`).join('');$('year').value='recent';const p=new URLSearchParams(location.search);if(p.get('open')){state.open=true;$('openOnly').classList.add('active')}bind();render()}
function bind(){['source','category','status','grade','year','min','max','sort'].forEach(id=>$(id).addEventListener(id==='min'||id==='max'?'input':'change',e=>{let k=id,v=e.target.value;if(id==='min'||id==='max')v=v?Number(v)*10000:null;state[k]=v;render()}));const runSearch=()=>{state.q=$('search').value.trim();render()};$('searchBtn').onclick=runSearch;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});$('openOnly').onclick=()=>{state.open=!state.open;$('openOnly').classList.toggle('active',state.open);render()};$('reset').onclick=()=>{state={q:'',source:'',category:'',status:'',grade:'',year:'recent',min:null,max:null,sort:'score',open:false};document.querySelectorAll('input,select').forEach(el=>{if(el.id==='sort')el.value='score';else if(el.id==='year')el.value='recent';else el.value=''});$('openOnly').classList.remove('active');render()};document.querySelector('.backdrop').onclick=closeDrawer;document.querySelector('.close').onclick=closeDrawer}
function matchYear(r){if(state.year==='')return true;const ds=String(r._date_sort_key||'');if(state.year==='recent'){if(ds.length<6)return true;return Number(ds.slice(0,6))>=recentCutoffYm()}return ds.startsWith(state.year)}
function filtered(){let rows=all.filter(r=>{if(state.q&&!Object.values(r).some(v=>String(v||'').toLowerCase().includes(state.q.toLowerCase())))return false;if(state.source&&r._source!==state.source)return false;if(state.category&&r._detail_category!==state.category)return false;if(state.status&&r._status!==state.status)return false;if(state.grade&&r._grade!==state.grade)return false;if(!matchYear(r))return false;if(state.open&&!r._is_open)return false;if(state.min!=null&&(r._amount||0)<state.min)return false;if(state.max!=null&&(r._amount||0)>state.max)return false;return true});rows.sort((a,b)=>state.sort==='amount'?(b._amount||0)-(a._amount||0):state.sort==='date'?String(b._date_sort_key||'').localeCompare(String(a._date_sort_key||'')):(b._score||0)-(a._score||0)||(b._amount||0)-(a._amount||0));return rows}
function render(){const rows=filtered(),open=rows.filter(r=>r._is_open),amount=rows.reduce((s,r)=>s+(r._amount||0),0),a=rows.filter(r=>r._grade==='A').length;$('stats').innerHTML=[['검색 결과',rows.length.toLocaleString()+'건'],['진행 중',open.length.toLocaleString()+'건'],['합계 금액',won(amount)],['A등급 즉시대응',a.toLocaleString()+'건']].map(x=>`<div class="stat"><div class="stat-label">${x[0]}</div><div class="stat-value">${x[1]}</div></div>`).join('');$('count').textContent=`${rows.length.toLocaleString()}건 중 최대 1,000건 표시`;$('rows').innerHTML=rows.slice(0,1000).map((r,i)=>`<tr data-i="${i}"><td><span class="grade ${r._grade}">${r._grade}</span><div class="sub">${r._score||0}점</div></td><td><div class="title">${esc(r._title)}${r._repeat_count>1?`<span class="badge repeat">${r._repeat_count}회 등록</span>`:''}</div><div class="sub">${esc(r._agency||'-')} · ${esc(r._tab||'')}</div></td><td>${esc(r._source)}</td><td><span class="badge ${['핵심장비','장비구매','장비임차'].includes(r._detail_category)?'equip':'other'}">${esc(r._detail_category)}</span></td><td class="num">${won(r._amount)}</td><td><span class="badge ${r._is_open?'open':'closed'}">${esc(r._status)}</span></td><td>${formatDate(r._date_sort_key)}</td><td>${esc(r._company||'-')}<div class="sub">${r._bid_rate!=null?'낙찰률 '+r._bid_rate+'%':''}</div></td><td><button class="lookup-btn" onclick="event.stopPropagation();openD2B(decodeURIComponent('${encodeURIComponent(r._source)}'),decodeURIComponent('${encodeURIComponent(r._lookup_keyword||r._title)}'))">조회</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">조건에 맞는 데이터가 없습니다.</td></tr>';document.querySelectorAll('tbody tr[data-i]').forEach(tr=>tr.onclick=()=>openDrawer(rows[Number(tr.dataset.i)]))}
function openD2B(source,keyword){const text=keyword||'';if(!text){alert('검색할 번호나 사업명이 없습니다.');return;}navigator.clipboard?.writeText(text).catch(()=>{});window.open('https://www.d2b.go.kr/search.do','_blank','noopener');setTimeout(()=>alert(source+' 검색어가 복사되었습니다.\nD2B 검색창에서 Ctrl+V 후 검색하세요.\n\n'+text),80)}
function formatDate(v){v=String(v||'');return v.length>=8?`${v.slice(0,4)}.${v.slice(4,6)}.${v.slice(6,8)}`:v.length>=6?`${v.slice(0,4)}.${v.slice(4,6)}`:v||'-'}
function openDrawer(r){const visible=Object.entries(r).filter(([k,v])=>!k.startsWith('_')&&v);$('drawerContent').innerHTML=`<div class="drawer-title">${esc(r._title)}</div><div class="hero-meta"><span class="grade ${r._grade}">${r._grade}</span><span class="badge ${r._is_open?'open':'closed'}">${esc(r._status)}</span><span class="badge ${['핵심장비','장비구매','장비임차'].includes(r._detail_category)?'equip':'other'}">${esc(r._detail_category)}</span>${r._repeat_count>1?`<span class="badge repeat">${r._repeat_count}회 등록</span>`:''}</div><div class="summary-grid"><div class="summary-box"><div class="k">발주기관</div><div class="v">${esc(r._agency||'-')}</div></div><div class="summary-box"><div class="k">사업금액</div><div class="v">${won(r._amount)}</div></div><div class="summary-box"><div class="k">출처 / 기준일</div><div class="v">${esc(r._source)} · ${formatDate(r._date_sort_key)}</div></div><div class="summary-box"><div class="k">우선순위</div><div class="v">${r._grade}등급 · ${r._score||0}점</div></div></div><div class="drawer-actions"><button class="lookup-btn" onclick="openD2B(decodeURIComponent('${encodeURIComponent(r._source)}'),decodeURIComponent('${encodeURIComponent(r._lookup_keyword||r._title)}'))">D2B에서 ${esc(r._source)} 조회</button></div><div class="detail">${visible.map(([k,v])=>`<div class="k">${esc(k)}</div><div>${esc(v)}</div>`).join('')}</div>`;$('drawer').classList.add('open')}
function closeDrawer(){$('drawer').classList.remove('open')}
</script></body></html>
