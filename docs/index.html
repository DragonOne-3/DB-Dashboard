<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음식물처리기 조달 데이터</title>
<style>
  :root {
    --bg: #12151A;
    --surface: #1B2028;
    --surface-hover: #212734;
    --line: #2A2F3A;
    --text: #E8EAED;
    --text-dim: #8B93A1;
    --amber: #FF9F1C;
    --amber-dim: #4A3517;
    --teal: #4FD1C5;
    --teal-dim: #163C39;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 24px 80px; }

  header { margin-bottom: 28px; }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em;
    color: var(--amber); text-transform: uppercase; margin-bottom: 10px;
  }
  h1 { font-size: 30px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin: 0; }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-top: 10px; }

  .nav-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--bg); background: var(--amber); font-weight: 600;
    font-size: 13.5px; padding: 10px 16px; border-radius: 8px;
    text-decoration: none; margin-top: 18px;
  }

  .scanbar {
    position: relative; height: 2px; background: var(--line);
    margin: 28px 0; overflow: hidden; border-radius: 2px;
  }
  .scanbar::after {
    content: ''; position: absolute; top: 0; left: -30%; width: 30%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    animation: sweep 2.2s ease-out 1;
  }
  @keyframes sweep { from { left: -30%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .scanbar::after { animation: none; display: none; } }

  .legend { display: flex; gap: 20px; margin-bottom: 8px; font-size: 12.5px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .dot.equip { background: var(--amber); }
  .dot.other { background: var(--teal); }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 24px; margin-bottom: 20px;
  }
  .panel h2 { font-size: 16px; margin: 0 0 4px; }
  .panel .panel-sub { font-size: 12.5px; color: var(--text-dim); margin: 0 0 18px; }

  .chart-scroll { overflow-x: auto; }
  svg text { font-family: var(--mono); fill: var(--text-dim); }
  .bar-equip { fill: var(--amber); }
  .bar-other { fill: var(--teal); }
  .bar-equip:hover, .bar-other:hover { opacity: 0.8; }
  .val-label { font-size: 10.5px; fill: var(--text); }
  .year-label { font-size: 11.5px; fill: var(--text-dim); }

  .empty { text-align: center; color: var(--text-dim); font-family: var(--mono); font-size: 13px; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">FOOD WASTE EQUIPMENT / SALES RADAR</div>
    <h1>음식물처리기 조달 데이터 — 연도별 금액 추이</h1>
    <p class="subtitle">발주계획 · 입찰공고 · 계약정보에서 음식물 처리기 및 처리용역에 대한 현황을 확인할 수 있습니다.</p>
    <div class="meta" id="updated-at">데이터 불러오는 중...</div>
    <a class="nav-link" href="leads.html">리드 목록 자세히 보기 →</a>
  </header>

  <div class="scanbar"></div>

  <div class="legend">
    <span><span class="dot equip"></span> 음식물처리기 (장비)</span>
    <span><span class="dot other"></span> 그 외 음식물 (위탁·용역 등)</span>
  </div>

  <div id="panels"></div>

</div>

<script>
let DATA = null;
const REFRESH_INTERVAL_MS = 3 * 60 * 1000;
const SOURCE_ORDER = ["발주계획", "계약정보", "입찰공고"];

function formatWon(n) {
  if (!n) return '0원';
  if (n >= 100000000) return (n / 100000000).toFixed(1) + '억원';
  if (n >= 10000) return Math.round(n / 10000).toLocaleString() + '만원';
  return n.toLocaleString() + '원';
}

function loadData(isInitial) {
  fetch('data.json?_=' + Date.now())
    .then(r => r.json())
    .then(json => {
      const changed = !DATA || DATA.updated_at !== json.updated_at;
      DATA = json;
      document.getElementById('updated-at').textContent =
        `마지막 업데이트: ${json.updated_at}  ·  검색 키워드: "${json.keyword}"`;
      if (isInitial || changed) renderPanels();
    })
    .catch(() => {
      if (isInitial) {
        document.getElementById('updated-at').textContent = '데이터를 불러오지 못했습니다.';
        document.getElementById('panels').innerHTML =
          `<div class="empty">data.json을 찾을 수 없습니다.</div>`;
      }
    });
}

function renderPanels() {
  const box = document.getElementById('panels');
  box.innerHTML = '';

  SOURCE_ORDER.forEach(label => {
    const yearly = (DATA.yearly && DATA.yearly[label]) || {};
    const years = Object.keys(yearly)
      .filter(y => y !== '미상')
      .sort();

    const panel = document.createElement('div');
    panel.className = 'panel';

    const totalEquip = years.reduce((s, y) => s + (yearly[y].equipment_sum || 0), 0);
    const totalOther = years.reduce((s, y) => s + (yearly[y].other_sum || 0), 0);

    panel.innerHTML = `
      <h2>${label}</h2>
      <p class="panel-sub">
        누적 금액 — 음식물처리기 ${formatWon(totalEquip)} · 그 외 음식물 ${formatWon(totalOther)}
        (금액 필드가 없는 행은 건수만 집계되고 합계에서는 제외됩니다)
      </p>
      <div class="chart-scroll"></div>
    `;
    box.appendChild(panel);

    const chartHost = panel.querySelector('.chart-scroll');
    if (years.length === 0) {
      chartHost.innerHTML = `<div class="empty">연도를 추정할 수 있는 데이터가 없습니다.</div>`;
      return;
    }
    chartHost.appendChild(buildChart(years, yearly));
  });
}

function buildChart(years, yearly) {
  const barW = 22, gap = 10, groupGap = 30;
  const groupW = barW * 2 + gap;
  const chartW = Math.max(600, years.length * (groupW + groupGap) + 40);
  const chartH = 220;
  const padBottom = 30, padTop = 24;

  const maxVal = Math.max(
    1,
    ...years.map(y => Math.max(yearly[y].equipment_sum || 0, yearly[y].other_sum || 0))
  );

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${chartW} ${chartH}`);
  svg.setAttribute('width', chartW);
  svg.setAttribute('height', chartH);

  years.forEach((y, i) => {
    const gx = 20 + i * (groupW + groupGap);
    const eqVal = yearly[y].equipment_sum || 0;
    const otVal = yearly[y].other_sum || 0;
    const eqH = (eqVal / maxVal) * (chartH - padTop - padBottom);
    const otH = (otVal / maxVal) * (chartH - padTop - padBottom);

    const eqRect = document.createElementNS(svgNS, 'rect');
    eqRect.setAttribute('class', 'bar-equip');
    eqRect.setAttribute('x', gx);
    eqRect.setAttribute('y', chartH - padBottom - eqH);
    eqRect.setAttribute('width', barW);
    eqRect.setAttribute('height', eqH);
    eqRect.setAttribute('rx', 3);
    const t1 = document.createElementNS(svgNS, 'title');
    t1.textContent = `${y}년 음식물처리기: ${formatWon(eqVal)} (${yearly[y].equipment_count}건)`;
    eqRect.appendChild(t1);
    svg.appendChild(eqRect);

    const otRect = document.createElementNS(svgNS, 'rect');
    otRect.setAttribute('class', 'bar-other');
    otRect.setAttribute('x', gx + barW + gap);
    otRect.setAttribute('y', chartH - padBottom - otH);
    otRect.setAttribute('width', barW);
    otRect.setAttribute('height', otH);
    otRect.setAttribute('rx', 3);
    const t2 = document.createElementNS(svgNS, 'title');
    t2.textContent = `${y}년 그 외 음식물: ${formatWon(otVal)} (${yearly[y].other_count}건)`;
    otRect.appendChild(t2);
    svg.appendChild(otRect);

    const yearLabel = document.createElementNS(svgNS, 'text');
    yearLabel.setAttribute('class', 'year-label');
    yearLabel.setAttribute('x', gx + groupW / 2 - 5);
    yearLabel.setAttribute('y', chartH - 10);
    yearLabel.setAttribute('text-anchor', 'middle');
    yearLabel.textContent = y;
    svg.appendChild(yearLabel);
  });

  return svg;
}

loadData(true);
setInterval(() => loadData(false), REFRESH_INTERVAL_MS);
</script>
</body>
</html>
