name: item history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '백필 시작일 (YYYYMMDD, 예: 20250601)'
        required: false
        default: ''
      end_date:
        description: '백필 종료일 (YYYYMMDD, 예: 20250630)'
        required: false
        default: ''
      start_year:
        description: '연도 단위 수집 시작 연도 (start_date 미입력시 사용)'
        required: false
        default: '2021'
      end_year:
        description: '연도 단위 수집 종료 연도 (start_date 미입력시 사용)'
        required: false
        default: '2025'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # [추가] 파일이 어디에 있는지 목록을 출력해서 확인합니다.
      - name: List files
        run: ls -R

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth pandas requests

      - name: Run History Collector
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          GOOGLE_AUTH_JSON: ${{ secrets.GOOGLE_AUTH_JSON }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          START_YEAR: ${{ github.event.inputs.start_year }}
          END_YEAR: ${{ github.event.inputs.end_year }}
        run: python history_collector.py
