name: Backfill 3 Years Data

# 수동 실행 버튼(workflow_dispatch) + 자동 반복 실행(schedule) 둘 다 지원
on:
  workflow_dispatch:
  schedule:
    # 5분마다 실행 (백필이 끝날 때까지 자동으로 계속 이어서 진행됨)
    # 다 끝난 뒤에는 이 workflow 파일을 지우거나 schedule 부분만 삭제하세요.
    - cron: '*/5 * * * *'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 한 번에 36개월씩 처리할 수 있도록 여유 있게 설정
    concurrency:
      group: backfill-3years   # 이전 실행이 끝나기 전에는 새 실행을 큐에서 대기시킴 (동시 실행 방지)
      cancel-in-progress: false

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 백필 스크립트 실행
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          GOOGLE_AUTH_JSON: ${{ secrets.GOOGLE_AUTH_JSON }}
          # 한 번 실행할 때 서비스당 최대 36개월(=3년 전체)까지 한 번에 처리
          BACKFILL_STEPS_PER_RUN: '36'
        run: python munitions_backfill_3y.py
