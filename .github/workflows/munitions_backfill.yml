name: Backfill (수동 실행 - 기간/서비스 선택)

# 자동 스케줄 없음 - Actions 탭에서 수동으로만 실행
on:
  workflow_dispatch:
    inputs:
      start_month:
        description: '시작 월 (YYYYMM, 예: 202301)'
        required: true
        type: string
      end_month:
        description: '종료 월 (YYYYMM, 예: 202412)'
        required: true
        type: string
      run_plan:
        description: '발주계획 수집'
        required: true
        type: boolean
        default: true
      run_contract:
        description: '계약정보 수집'
        required: true
        type: boolean
        default: true
      run_bid:
        description: '입찰공고 수집'
        required: true
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 선택한 서비스 목록 조합
        id: services
        run: |
          SERVICES=""
          if [ "${{ inputs.run_plan }}" = "true" ]; then SERVICES="${SERVICES}plan,"; fi
          if [ "${{ inputs.run_contract }}" = "true" ]; then SERVICES="${SERVICES}contract,"; fi
          if [ "${{ inputs.run_bid }}" = "true" ]; then SERVICES="${SERVICES}bid,"; fi
          echo "list=${SERVICES%,}" >> "$GITHUB_OUTPUT"

      - name: 백필 스크립트 실행
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          GOOGLE_AUTH_JSON: ${{ secrets.GOOGLE_AUTH_JSON }}
          BACKFILL_START_MONTH: ${{ inputs.start_month }}
          BACKFILL_END_MONTH: ${{ inputs.end_month }}
          BACKFILL_SERVICES: ${{ steps.services.outputs.list }}
        run: python munitions_backfill_3y.py
