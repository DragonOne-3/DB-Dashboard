name: Update Food Waste Dashboard

on:
  schedule:
    - cron: '20 21 * * *' # 매일 06:20 KST
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '계약/공고 재수집 기간(일)'
        required: false
        default: '7'
      full_refresh:
        description: '최근 1년 전체 재수집 여부'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: food-waste-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      GOOGLE_AUTH_JSON: ${{ secrets.GOOGLE_AUTH_JSON }}
      PROCUREMENT_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
      PROCUREMENT_RETENTION_DAYS: '365'
      PROCUREMENT_FULL_REFRESH: ${{ github.event.inputs.full_refresh || 'false' }}
      PROCUREMENT_MAX_WORKERS: '3'
      DASHBOARD_OUTPUT_DIR: docs/data
      DASHBOARD_OUTPUT_PATH: docs/data.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dashboard.txt

      - name: Install dependencies
        run: pip install -r requirements-dashboard.txt

      - name: Validate Python sources
        run: python -m py_compile procurement_common.py munitions_plan.py munitions_contract.py munitions_notice.py dashboard_data.py

      - name: Collect procurement plans
        run: python munitions_plan.py

      - name: Collect contracts
        run: python munitions_contract.py

      - name: Collect bid notices
        run: python munitions_notice.py

      - name: Build dashboard data
        run: python dashboard_data.py

      - name: Validate generated JSON
        run: |
          python -m json.tool docs/data/summary.json > /dev/null
          python -m json.tool docs/data/leads.json > /dev/null
          python -m json.tool docs/data.json > /dev/null

      - name: Show generated sizes
        run: ls -lh docs/data.json docs/data/summary.json docs/data/leads.json

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data/summary.json docs/data/leads.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Update procurement dashboard data"
            git push
          fi
