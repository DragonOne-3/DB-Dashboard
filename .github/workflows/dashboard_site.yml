name: Update Dashboard Site Data

on:
  workflow_dispatch:
  schedule:
    # 매일 오전 8시(UTC) = 한국시간 오전 5시
    - cron: '0 8 * * *'

permissions:
  contents: write   # 결과 파일을 저장소에 커밋하기 위해 필요

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install gspread oauth2client

      - name: 대시보드 데이터(JSON) 생성
        env:
          GOOGLE_AUTH_JSON: ${{ secrets.GOOGLE_AUTH_JSON }}
          DASHBOARD_KEYWORD: '음식물'
          DASHBOARD_OUTPUT_PATH: 'docs/data.json'
        run: python generate_dashboard_data.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "대시보드 데이터 자동 갱신"
          git push
